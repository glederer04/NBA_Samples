[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-rotation-lab"
version = "0.1.0"
description = "NBA lineup and rotation decision-support system."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "dash>=4.4,<5",
    "dash-bootstrap-components>=2.0,<3",
    "duckdb>=1.5,<2",
    "gunicorn>=23,<24",
    "nba_api>=1.11,<2",
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "plotly>=6.0,<7",
    "pyarrow>=18,<24",
    "reportlab>=4.2,<5",
    "requests>=2.32,<3",
    "scikit-learn>=1.6,<2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<3",
    "pypdf>=5,<7",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
